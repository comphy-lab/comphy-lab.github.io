# Catalogue of live CoMPhy Lab project documentation sites hosted at
# https://comphy-lab.org/{repo}/ (GitHub Pages for comphy-lab/* repos).
#
# How to add an entry:
#   1. Confirm the Pages site returns HTTP 200 at
#      https://comphy-lab.org/{repo}/
#   2. Append an item below with repo, title, and optional note.
#   3. Keep the list sorted alphabetically by title (case-insensitive),
#      or rely on the page template which sorts by title at build time.
#   4. Do not list comphy-lab.github.io (this site) or known 404s.
#
# Fields:
#   repo   GitHub repo slug under comphy-lab/ (also the URL path).
#   title  Human-readable label shown on /projects/.
#   note   Optional one-line context (shown muted under the title).

