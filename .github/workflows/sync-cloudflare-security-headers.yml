name: Sync Cloudflare security headers

on:
  workflow_dispatch:

permissions:
  contents: read

# Serialize dispatch runs so concurrent workflows cannot PUT stale sibling
# snapshots over each other.
concurrency:
  group: sync-cloudflare-security-headers
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Refusing Cloudflare header sync from ${GITHUB_REF}; use main."
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Sync response header transform rule
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: python3 scripts/sync-cloudflare-security-headers.py
