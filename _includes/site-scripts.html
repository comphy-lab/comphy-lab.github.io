<!-- Canonical site JS stack. Keep native defer order: Rocket Loader must
     not delay or replay it. scripts/check-script-includes.sh enforces order. -->
<script defer data-cfasync="false" src="/assets/js/defer-styles.js"></script>
{% include browser-dependencies.html %}
<script defer data-cfasync="false" src="/assets/js/utils.js"></script>
<script defer data-cfasync="false" src="/assets/js/search-manager.js"></script>
<script defer data-cfasync="false" src="/assets/js/command-palette.js"></script>
<script defer data-cfasync="false" src="/assets/js/main.js"></script>
{% if page.body_class contains "contact-card-page" %}
<script defer data-cfasync="false" src="/assets/js/contact-card.js"></script>
{% endif %}
{% if page.layout == "teaching" %}
<script defer data-cfasync="false" src="/assets/js/teaching.js"></script>
{% endif %}
<script defer data-cfasync="false" src="/assets/js/command-data.js"></script>
<script defer data-cfasync="false" src="/assets/js/platform-utils.js"></script>
